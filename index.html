<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>موسم کا حال</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Nastaliq+Urdu:wght@400;700&family=Playfair+Display:wght@400;700&family=Merriweather:wght@400;700&display=swap">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg1:#0a0a1a;--bg2:#0d1b3e;
  --gold:#e8c86a;--gold2:#f5e09a;
  --text:#f0e8d0;--text2:#c8bfa0;
  --green:#16a34a;--green2:#22c55e;
  --red:#dc2626;--red2:#ef4444;
  --purple:#7c3aed;--blue:#1a3a6e;
  --card-bg:rgba(255,255,255,0.05);
  --card-border:rgba(232,200,106,0.2);
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
html,body{height:100%;background:var(--bg1);color:var(--text);overflow-x:hidden}
body{font-family:'Noto Nastaliq Urdu','Noto Naskh Arabic',serif;min-height:100vh;position:relative;display:flex;flex-direction:column}

/* Aurora */
.aurora{position:fixed;width:100%;height:100%;top:0;left:0;z-index:0;pointer-events:none;
  background:
    radial-gradient(ellipse 80% 50% at 20% 10%,rgba(30,60,140,0.4) 0%,transparent 60%),
    radial-gradient(ellipse 60% 40% at 80% 80%,rgba(60,20,100,0.35) 0%,transparent 60%),
    radial-gradient(ellipse 50% 35% at 50% 40%,rgba(10,80,120,0.25) 0%,transparent 70%),
    radial-gradient(ellipse 30% 20% at 70% 20%,rgba(100,20,80,0.2) 0%,transparent 60%);
  animation:auroraMove 14s ease-in-out infinite alternate}
@keyframes auroraMove{0%{opacity:.7;transform:scale(1) rotate(0deg)}100%{opacity:1;transform:scale(1.06) rotate(1deg)}}

/* Stars */
.stars{position:fixed;width:100%;height:100%;top:0;left:0;z-index:0;pointer-events:none}
.star{position:absolute;border-radius:50%;background:#fff;animation:twinkle var(--d) ease-in-out infinite alternate}
@keyframes twinkle{0%{opacity:0.1;transform:scale(0.8)}100%{opacity:0.7;transform:scale(1.2)}}

/* Layout */
.container{position:relative;z-index:2;flex:1;display:flex;flex-direction:column;align-items:center;padding:20px 16px 30px;max-width:480px;margin:0 auto;width:100%}

/* Header */
.lang-row{display:flex;justify-content:flex-start;gap:8px;width:100%;margin-bottom:16px}
.lang-btn{background:rgba(232,200,106,0.12);border:1px solid rgba(232,200,106,0.3);border-radius:20px;padding:4px 14px;color:var(--gold2);font-size:12px;cursor:pointer;transition:all .2s;font-family:inherit}
.lang-btn.active{background:rgba(232,200,106,0.3);border-color:var(--gold);color:var(--gold)}
.lang-btn:active{transform:scale(.92)}

.app-title{font-family:'Noto Nastaliq Urdu',serif;font-size:26px;color:var(--gold);text-shadow:0 0 20px rgba(232,200,106,0.5);margin-bottom:4px;text-align:center}
.app-title.en{font-family:'Playfair Display',serif;font-size:24px}
.app-subtitle{font-size:12px;color:var(--text2);text-align:center;margin-bottom:28px}
.app-subtitle.en{font-family:'Merriweather',serif;font-size:11px}

/* Main weather button */
.weather-btn{background:linear-gradient(135deg,rgba(30,60,140,0.8),rgba(60,20,100,0.8));border:2px solid rgba(232,200,106,0.4);border-radius:20px;padding:18px 36px;color:var(--gold2);font-family:'Noto Nastaliq Urdu',serif;font-size:18px;cursor:pointer;transition:all .3s;box-shadow:0 0 30px rgba(232,200,106,0.15);width:100%;position:relative;overflow:hidden}
.weather-btn.en{font-family:'Playfair Display',serif;font-size:16px}
.weather-btn:hover{transform:translateY(-2px);box-shadow:0 0 40px rgba(232,200,106,0.25);border-color:rgba(232,200,106,0.7)}
.weather-btn:active{transform:scale(.97)}
.weather-btn .btn-icon{font-size:28px;display:block;margin-bottom:6px}
.weather-btn-shine{position:absolute;top:-50%;left:-60%;width:40%;height:200%;background:linear-gradient(90deg,transparent,rgba(255,255,255,0.08),transparent);transform:skewX(-20deg);animation:shine 3s infinite}
@keyframes shine{0%{left:-60%}100%{left:150%}}

/* Loading */
.loading{display:none;text-align:center;margin:20px 0}
.loading-dots{display:flex;gap:8px;justify-content:center;margin-bottom:12px}
.dot{width:10px;height:10px;border-radius:50%;background:var(--gold);animation:bounce 1.2s ease-in-out infinite}
.dot:nth-child(2){animation-delay:.2s}
.dot:nth-child(3){animation-delay:.4s}
@keyframes bounce{0%,100%{transform:translateY(0);opacity:.4}50%{transform:translateY(-12px);opacity:1}}
.loading-text{font-size:13px;color:var(--text2)}
.loading-text.en{font-family:'Merriweather',serif;font-size:11px}

/* Result card */
.result-card{display:none;width:100%;background:linear-gradient(135deg,rgba(20,40,100,0.6),rgba(40,10,70,0.5));border:2px solid rgba(232,200,106,0.35);border-radius:24px;padding:24px 20px;margin-top:20px;animation:fadeUp .5s ease}
@keyframes fadeUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}

.date-row{text-align:center;margin-bottom:16px}
.date-label{font-size:13px;color:var(--gold2)}
.date-label.en{font-family:'Merriweather',serif;font-size:11px}
.date-val{font-size:16px;color:var(--text);margin-top:2px}
.date-val.en{font-family:'Playfair Display',serif;font-size:15px}

.temp-row{display:flex;align-items:center;justify-content:center;gap:12px;margin:16px 0}
.temp-icon{font-size:48px}
.temp-num{font-size:64px;font-weight:700;color:var(--gold);font-family:'Playfair Display',serif;line-height:1;text-shadow:0 0 20px rgba(232,200,106,0.4)}
.temp-unit{font-size:28px;color:var(--gold2);font-family:'Playfair Display',serif;align-self:flex-start;margin-top:10px}

.location-row{text-align:center;margin-bottom:20px}
.location-label{font-size:11px;color:var(--text2)}
.location-label.en{font-family:'Merriweather',serif}
.location-val{font-size:13px;color:var(--text2);margin-top:2px}

.divider{height:1px;background:rgba(232,200,106,0.2);margin:16px 0}

.msg-label{font-size:11px;color:var(--gold2);margin-bottom:10px;text-align:center}
.msg-label.en{font-family:'Merriweather',serif}
.urdu-msg{font-family:'Noto Nastaliq Urdu',serif;font-size:17px;color:var(--text);line-height:2.2;text-align:right;background:rgba(0,0,0,0.2);border-radius:14px;padding:14px 16px;border:1px solid rgba(232,200,106,0.15);direction:rtl}

/* Device ID badge */
.device-badge{display:inline-flex;align-items:center;gap:5px;background:rgba(124,58,237,0.2);border:1px solid rgba(167,139,250,0.3);border-radius:20px;padding:3px 10px;font-size:10px;color:rgba(167,139,250,0.8);margin-top:16px}
.device-badge.en{font-family:'Merriweather',serif}

/* Refresh button */
.refresh-btn{margin-top:20px;background:rgba(232,200,106,0.1);border:1px solid rgba(232,200,106,0.3);border-radius:12px;padding:10px 24px;color:var(--gold2);font-family:'Noto Nastaliq Urdu',serif;font-size:14px;cursor:pointer;width:100%;transition:all .2s}
.refresh-btn.en{font-family:'Merriweather',serif;font-size:12px}
.refresh-btn:active{transform:scale(.96)}

/* Error */
.error-box{display:none;background:rgba(220,38,38,0.15);border:1px solid rgba(239,68,68,0.3);border-radius:16px;padding:16px;text-align:center;margin-top:20px;width:100%}
.error-text{font-size:13px;color:var(--red2)}
.error-text.en{font-family:'Merriweather',serif;font-size:11px}

/* Footer */
.footer{text-align:center;margin-top:28px;font-size:10px;color:rgba(255,255,255,0.2)}
.footer.en{font-family:'Merriweather',serif}

@media (prefers-reduced-motion:reduce){.aurora,.star,.dot,.weather-btn-shine{animation:none}}
</style>
</head>
<body>
<div class="aurora"></div>
<div class="stars" id="starsContainer"></div>

<div class="container">
  <!-- Language buttons -->
  <div class="lang-row">
    <button class="lang-btn active" onclick="setLang('ur')" id="btnUr">🇵🇰 اردو</button>
    <button class="lang-btn" onclick="setLang('en')" id="btnEn">🇬🇧 English</button>
  </div>

  <!-- Title -->
  <div class="app-title" id="appTitle">موسم کا حال</div>
  <div class="app-subtitle" id="appSubtitle">آپ کے موبائل اور آج کے موسم کا خاص پیغام</div>

  <!-- Main button -->
  <button class="weather-btn" onclick="getWeather()" id="mainBtn">
    <span class="weather-btn-shine"></span>
    <span class="btn-icon">🌤️</span>
    <span id="btnText">موسم کا حال دیکھیں</span>
  </button>

  <!-- Loading -->
  <div class="loading" id="loading">
    <div class="loading-dots">
      <div class="dot"></div>
      <div class="dot"></div>
      <div class="dot"></div>
    </div>
    <div class="loading-text" id="loadingText">موسم معلوم کر رہے ہیں...</div>
  </div>

  <!-- Error -->
  <div class="error-box" id="errorBox">
    <div class="error-text" id="errorText">❌ موسم معلوم نہیں ہو سکا۔ دوبارہ کوشش کریں۔</div>
  </div>

  <!-- Result card -->
  <div class="result-card" id="resultCard">
    <div class="date-row">
      <div class="date-label" id="dateLbl">📅 تاریخ</div>
      <div class="date-val" id="dateVal">—</div>
    </div>

    <div class="temp-row">
      <div class="temp-icon" id="tempIcon">🌡️</div>
      <div class="temp-num" id="tempNum">—</div>
      <div class="temp-unit">°C</div>
    </div>

    <div class="location-row">
      <div class="location-label" id="locLbl">📍 مقام</div>
      <div class="location-val" id="locVal">—</div>
    </div>

    <div class="divider"></div>

    <div class="msg-label" id="msgLbl">✍️ آج کا پیغام</div>
    <div class="urdu-msg" id="urduMsg">—</div>

    <div style="text-align:center">
      <span class="device-badge" id="deviceBadge">🔮 آپ کا خاص پیغام</span>
    </div>
  </div>

  <!-- Refresh -->
  <button class="refresh-btn" id="refreshBtn" style="display:none" onclick="getWeather()">
    🔄 <span id="refreshText">دوبارہ دیکھیں</span>
  </button>

  <div class="footer" id="footer">Open-Meteo API · GPS Location</div>
</div>

<script>
// ═══════════════════════════════════════════
// LANGUAGE
// ═══════════════════════════════════════════
let lang = 'ur';

const T = {
  ur: {
    title: 'موسم کا حال',
    subtitle: 'آپ کے موبائل اور آج کے موسم کا خاص پیغام',
    btnText: 'موسم کا حال دیکھیں',
    loading: 'موسم معلوم کر رہے ہیں...',
    error: '❌ موسم معلوم نہیں ہو سکا۔ دوبارہ کوشش کریں۔',
    errorGps: '❌ GPS کی اجازت دیں اور دوبارہ کوشش کریں۔',
    dateLbl: '📅 تاریخ',
    locLbl: '📍 مقام',
    msgLbl: '✍️ آج کا پیغام',
    badge: '🔮 آپ کا خاص پیغام',
    refresh: 'دوبارہ دیکھیں',
    footer: 'Open-Meteo API · GPS مقام',
  },
  en: {
    title: 'Weather Today',
    subtitle: 'A unique message for your device & today\'s weather',
    btnText: '🌤️ Check Weather',
    loading: 'Fetching your weather...',
    error: '❌ Could not get weather. Please try again.',
    errorGps: '❌ Please allow GPS access and try again.',
    dateLbl: '📅 Date',
    locLbl: '📍 Location',
    msgLbl: '✍️ Today\'s Message',
    badge: '🔮 Your Unique Message',
    refresh: '🔄 Check Again',
    footer: 'Open-Meteo API · GPS Location',
  }
};

function setLang(l) {
  lang = l;
  document.documentElement.lang = l === 'ur' ? 'ur' : 'en';
  document.documentElement.dir = l === 'ur' ? 'rtl' : 'ltr';

  document.getElementById('btnUr').classList.toggle('active', l === 'ur');
  document.getElementById('btnEn').classList.toggle('active', l === 'en');

  const isEn = l === 'en';
  const fontCls = isEn ? 'en' : '';

  const els = {
    appTitle: T[l].title,
    appSubtitle: T[l].subtitle,
    btnText: T[l].btnText,
    loadingText: T[l].loading,
    dateLbl: T[l].dateLbl,
    locLbl: T[l].locLbl,
    msgLbl: T[l].msgLbl,
    deviceBadge: T[l].badge,
    refreshText: T[l].refresh,
    footer: T[l].footer,
  };

  for (const [id, txt] of Object.entries(els)) {
    const el = document.getElementById(id);
    if (el) {
      el.textContent = txt;
      el.className = el.className.replace(/\ben\b/g, '').trim() + (isEn ? ' en' : '');
    }
  }

  document.getElementById('mainBtn').className = 'weather-btn' + (isEn ? ' en' : '');
  document.getElementById('refreshBtn').className = 'refresh-btn' + (isEn ? ' en' : '');
  document.getElementById('errorText').className = 'error-text' + (isEn ? ' en' : '');
  document.getElementById('loading').querySelector('.loading-text').className = 'loading-text' + (isEn ? ' en' : '');
}

// ═══════════════════════════════════════════
// STARS
// ═══════════════════════════════════════════
(function createStars() {
  const c = document.getElementById('starsContainer');
  for (let i = 0; i < 80; i++) {
    const s = document.createElement('div');
    s.className = 'star';
    const size = Math.random() * 2 + 1;
    s.style.cssText = `
      left:${Math.random()*100}%;
      top:${Math.random()*100}%;
      width:${size}px;height:${size}px;
      --d:${2+Math.random()*4}s;
      animation-delay:${Math.random()*4}s;
      opacity:${Math.random()*0.5+0.1}
    `;
    c.appendChild(s);
  }
})();

// ═══════════════════════════════════════════
// DEVICE ID
// ═══════════════════════════════════════════
function getDeviceId() {
  let id = localStorage.getItem('wx_device_id');
  if (!id) {
    id = Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
    localStorage.setItem('wx_device_id', id);
  }
  return id;
}

// ═══════════════════════════════════════════
// MESSAGE PICKER
// ═══════════════════════════════════════════

function getTempKey(temp) {
  if (temp <= -13) return 'minus15';
  if (temp <= -8) return 'minus10';
  if (temp <= -3) return 'minus5';
  if (temp <= 2) return '0';
  if (temp <= 7) return '5';
  if (temp <= 12) return '10';
  if (temp <= 17) return '15';
  if (temp <= 22) return '20';
  if (temp <= 27) return '25';
  if (temp <= 32) return '35'; // placeholder
  if (temp <= 37) return '35';
  if (temp <= 47) return '45';
  return '55';
}

function getTempIcon(temp) {
  if (temp <= 0) return '🥶';
  if (temp <= 10) return '❄️';
  if (temp <= 18) return '🌨️';
  if (temp <= 23) return '🌤️';
  if (temp <= 28) return '☀️';
  if (temp <= 35) return '🌞';
  if (temp <= 42) return '🔥';
  return '🔥🔥';
}

function getMessage(temp, deviceId) {
  const key = getTempKey(temp);
  const pool = weatherMessages[key];
  // Seed: device id + today date
  const today = new Date().toISOString().slice(0,10);
  const seed = deviceId + today + temp;
  let hash = 0;
  for (let i = 0; i < seed.length; i++) {
    hash = ((hash << 5) - hash) + seed.charCodeAt(i);
    hash |= 0;
  }
  const idx = Math.abs(hash) % pool.length;
  return pool[idx];
}

const UD = ['اتوار','پیر','منگل','بدھ','جمعرات','جمعہ','ہفتہ'];
const UM = ['جنوری','فروری','مارچ','اپریل','مئی','جون','جولائی','اگست','ستمبر','اکتوبر','نومبر','دسمبر'];

function getDateString() {
  const d = new Date();
  if (lang === 'en') {
    const days = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
    const months = ['January','February','March','April','May','June','July','August','September','October','November','December'];
    return `${days[d.getDay()]}, ${d.getDate()} ${months[d.getMonth()]} ${d.getFullYear()}`;
  }
  return `${UD[d.getDay()]}، ${d.getDate()} ${UM[d.getMonth()]} ${d.getFullYear()}`;
}

let fetching = false;

function show(id) { document.getElementById(id).style.display = 'block'; }
function hide(id) { document.getElementById(id).style.display = 'none'; }

async function getWeather() {
  if (fetching) return;
  fetching = true;

  hide('resultCard');
  hide('errorBox');
  hide('refreshBtn');
  document.getElementById('loading').style.display = 'block';
  document.getElementById('loadingText').textContent = T[lang].loading;

  try {
    // 1. Get GPS
    const pos = await new Promise((res, rej) =>
      navigator.geolocation.getCurrentPosition(res, rej, {timeout:10000, maximumAge:60000})
    );
    const lat = pos.coords.latitude.toFixed(4);
    const lon = pos.coords.longitude.toFixed(4);

    // 2. Get weather from Open-Meteo
    const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m&timezone=auto`;
    const resp = await fetch(url);
    if (!resp.ok) throw new Error('API error');
    const data = await resp.json();
    const temp = Math.round(data.current.temperature_2m);

    // 3. Get location name (reverse geocode)
    let locName = `${lat}, ${lon}`;
    try {
      const geo = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lon}&accept-language=ur`);
      if (geo.ok) {
        const gd = await geo.json();
        const a = gd.address;
        locName = a.city || a.town || a.village || a.county || a.state || locName;
      }
    } catch {}

    // 4. Build result
    const deviceId = getDeviceId();
    const msg = getMessage(temp, deviceId);

    document.getElementById('loading').style.display = 'none';
    document.getElementById('dateVal').textContent = getDateString();
    document.getElementById('tempNum').textContent = temp;
    document.getElementById('tempIcon').textContent = getTempIcon(temp);
    document.getElementById('locVal').textContent = locName;
    document.getElementById('urduMsg').textContent = msg;

    // Update labels per lang
    document.getElementById('dateLbl').textContent = T[lang].dateLbl;
    document.getElementById('locLbl').textContent = T[lang].locLbl;
    document.getElementById('msgLbl').textContent = T[lang].msgLbl;
    document.getElementById('deviceBadge').textContent = T[lang].badge;

    show('resultCard');
    document.getElementById('refreshBtn').style.display = 'block';
    document.getElementById('refreshText').textContent = T[lang].refresh;
    document.getElementById('refreshBtn').className = 'refresh-btn' + (lang==='en'?' en':'');

  } catch (e) {
    document.getElementById('loading').style.display = 'none';
    const isGps = e.code === 1; // permission denied
    document.getElementById('errorText').textContent = isGps ? T[lang].errorGps : T[lang].error;
    show('errorBox');
    document.getElementById('refreshBtn').style.display = 'block';
    document.getElementById('refreshText').textContent = T[lang].refresh;
  }

  fetching = false;
}
</script>
</body>
</html>
