<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Piper آواز ٹیسٹ</title>
<style>
  body { background:#0a0f1e; color:#f0e8d0; font-family:'Noto Nastaliq Urdu',serif;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    min-height:100vh; margin:0; padding:20px; box-sizing:border-box; }
  h2 { color:#e8c86a; margin-bottom:24px; font-size:22px; text-align:center; }
  textarea { width:100%; max-width:400px; background:rgba(255,255,255,0.07);
    border:1px solid rgba(167,139,250,0.4); border-radius:14px; padding:14px;
    color:#f0e8d0; font-family:'Noto Nastaliq Urdu',serif; font-size:16px;
    line-height:2; resize:none; outline:none; direction:rtl; }
  button { margin-top:16px; padding:12px 36px; background:linear-gradient(135deg,#7c3aed,#a78bfa);
    border:none; border-radius:14px; color:#fff; font-size:16px; cursor:pointer;
    font-family:inherit; transition:transform .2s; }
  button:active { transform:scale(.95); }
  button:disabled { opacity:.5; cursor:not-allowed; }

  /* Progress */
  #dlBox { width:100%; max-width:400px; margin-top:20px; display:none; }
  #dlBox.show { display:block; }
  .dl-top { display:flex; justify-content:space-between; margin-bottom:5px; font-size:12px; color:#a78bfa; }
  .bar-bg { background:rgba(124,58,237,0.2); border-radius:10px; height:8px; overflow:hidden; }
  .bar { height:100%; width:0%; background:linear-gradient(90deg,#7c3aed,#a78bfa);
    border-radius:10px; transition:width .2s; }
  #dlInfo { font-size:11px; color:#a09880; text-align:center; margin-top:5px; }
  #status { margin-top:16px; font-size:13px; color:#a78bfa; text-align:center; min-height:24px; }
</style>
</head>
<body>

<h2>🎙️ Piper اردو آواز ٹیسٹ</h2>
<textarea id="txt" rows="4" placeholder="یہاں اردو لکھیں...">السلام علیکم! میں اردو میں بول رہا ہوں۔</textarea>
<button id="btn" onclick="doSpeak()">🔊 سنیں</button>

<!-- Progress Bar -->
<div id="dlBox">
  <div class="dl-top">
    <span>📥 آواز ڈاؤن لوڈ ہو رہی ہے...</span>
    <span id="dlPct">0%</span>
  </div>
  <div class="bar-bg"><div class="bar" id="dlBar"></div></div>
  <div id="dlInfo">ابھی شروع ہو رہی ہے...</div>
</div>

<div id="status">⏳ پہلی بار آواز لوڈ ہو گی...</div>

<script type="module">
const ONNX = 'https://huggingface.co/rhasspy/piper-voices/resolve/main/ur/ur_PK/aegis_female/medium/ur_PK-aegis_female-medium.onnx';
const JURL = 'https://huggingface.co/rhasspy/piper-voices/resolve/main/ur/ur_PK/aegis_female/medium/ur_PK-aegis_female-medium.onnx.json';
const CACHE = 'piper-aegis-v1';

let piperTTS = null;
let loading = false;

function setStatus(t){ document.getElementById('status').textContent = t; }
function dlShow(v){ document.getElementById('dlBox').classList[v?'add':'remove']('show'); }

function dlUpdate(loaded, total, t0){
  const pct = total ? Math.round(loaded/total*100) : 0;
  document.getElementById('dlBar').style.width = pct+'%';
  document.getElementById('dlPct').textContent = pct+'%';
  const sec = (Date.now()-t0)/1000;
  if(sec > 0.5 && loaded > 0){
    const kbps = Math.round(loaded/1024/sec);
    const mb = (loaded/1048576).toFixed(1);
    const tot = total ? (total/1048576).toFixed(1) : '?';
    const rem = (total&&kbps) ? Math.round((total-loaded)/1024/kbps) : '?';
    document.getElementById('dlInfo').textContent =
      `${mb} MB / ${tot} MB  •  ${kbps} KB/s  •  ${rem} سیکنڈ باقی`;
  }
}

async function fetchProgress(url){
  const t0 = Date.now();
  const res = await fetch(url);
  if(!res.ok) throw new Error('download fail');
  const total = parseInt(res.headers.get('content-length')||'0');
  const reader = res.body.getReader();
  const chunks = []; let loaded = 0;
  while(true){
    const {done, value} = await reader.read();
    if(done) break;
    chunks.push(value); loaded += value.length;
    dlUpdate(loaded, total, t0);
  }
  const out = new Uint8Array(loaded); let pos = 0;
  for(const c of chunks){ out.set(c,pos); pos+=c.length; }
  return out.buffer;
}

async function loadPiper(){
  if(piperTTS) return true;
  if(loading) return false;
  loading = true;

  try{
    const cache = await caches.open(CACHE);
    const cached = await cache.match(ONNX);

    if(!cached){
      setStatus('📥 پہلی بار آواز ڈاؤن لوڈ ہو رہی ہے...');
      dlShow(true);
      const buf = await fetchProgress(ONNX);
      await cache.put(ONNX, new Response(buf, {headers:{'Content-Type':'application/octet-stream'}}));
      const jbuf = await fetchProgress(JURL);
      await cache.put(JURL, new Response(jbuf, {headers:{'Content-Type':'application/json'}}));
      dlShow(false);
      setStatus('✅ ڈاؤن لوڈ مکمل! اب لوڈ ہو رہی ہے...');
    } else {
      setStatus('⚡ Cache سے لوڈ ہو رہی ہے...');
    }

    const { PiperNativeTTS } = await import('https://cdn.jsdelivr.net/npm/pipertts/dist/index.js');
    piperTTS = await PiperNativeTTS.load({
      model: 'hub:aegis-female-ur-pk-medium',
      modelsDir: './models'
    });
    loading = false;
    setStatus('✅ تیار ہے! سنیں بٹن دبائیں۔');
    return true;
  } catch(e){
    loading = false;
    dlShow(false);
    setStatus('❌ لوڈ نہ ہو سکی: ' + e.message);
    console.error(e);
    return false;
  }
}

window.doSpeak = async function(){
  const text = document.getElementById('txt').value.trim();
  if(!text) return;
  const btn = document.getElementById('btn');
  btn.disabled = true;

  const ok = await loadPiper();
  if(!ok){ btn.disabled=false; return; }

  try{
    setStatus('🔊 بول رہا ہے...');
    const { audio } = await piperTTS.synthesize(text);
    const url = URL.createObjectURL(new Blob([audio], {type:'audio/wav'}));
    const a = new Audio(url);
    a.onended = ()=>{ URL.revokeObjectURL(url); setStatus('✅ تیار ہے!'); btn.disabled=false; };
    a.onerror = ()=>{ URL.revokeObjectURL(url); setStatus('❌ آواز نہ آئی'); btn.disabled=false; };
    a.play();
  } catch(e){
    setStatus('❌ خطا: ' + e.message);
    btn.disabled = false;
  }
};

// صفحہ کھلتے ہی خاموشی سے لوڈ شروع
loadPiper();
</script>
</body>
</html>
